apiVersion: 1

datasources:
  - name: Prometheus
    type: prometheus
    uid: copilot-prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 15s
      exemplarTraceIdDestinations:
        - name: trace_id
          datasourceUid: copilot-tempo

  - name: Tempo
    type: tempo
    uid: copilot-tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      tracesToMetrics:
        datasourceUid: copilot-prometheus
      serviceMap:
        datasourceUid: copilot-prometheus
      nodeGraph:
        enabled: true
