# Collector config for the Docker Compose stack.
#
# Receives OTLP from Copilot clients, fans metrics out to Prometheus and traces
# out to Tempo. The `debug` exporter stays on at normal verbosity so
# `docker compose logs -f collector` tells you whether data is arriving.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
        # Copilot clients post from a developer machine, so allow the browser
        # and CLI origins you expect. Tighten this for a shared deployment.
        cors:
          allowed_origins:
            - "http://localhost:*"
            - "http://127.0.0.1:*"

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  # Guard rail: one busy developer should not be able to OOM the collector.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  # Copilot stamps prompts and tool arguments onto spans only when
  # `captureContent` is true. If you ever turn that on, this is where you would
  # scrub. Left commented so the default pipeline stays lossless.
  #
  # redaction:
  #   allow_all_keys: true
  #   blocked_values: ["ghp_[A-Za-z0-9]{36}", "github_pat_[A-Za-z0-9_]{82}"]

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Copies service.name / service.version onto every series so you can filter
    # by client version in Grafana.
    resource_to_telemetry_conversion:
      enabled: true

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  debug:
    verbosity: normal

service:
  telemetry:
    logs:
      level: info
  pipelines:
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheus, debug]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
