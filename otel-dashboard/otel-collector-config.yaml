# Collector config for the Docker Compose stack.
#
# Receives OTLP from Copilot clients, fans metrics out to Prometheus and traces
# out to Tempo. The `debug` exporter stays on at normal verbosity so
# `docker compose logs -f collector` tells you whether data is arriving.

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4319
        # Copilot clients post from a developer machine, so allow the browser
        # and CLI origins you expect. Tighten this for a shared deployment.
        cors:
          allowed_origins:
            - "http://localhost:*"
            - "http://127.0.0.1:*"

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024

  # Guard rail: one busy developer should not be able to OOM the collector.
  memory_limiter:
    check_interval: 1s
    limit_percentage: 75
    spike_limit_percentage: 20

  # Cardinality guard, metrics only. Order matters here.
  #
  # `resource_to_telemetry_conversion` on the Prometheus exporter promotes every
  # resource attribute to a label, which is what makes `service.version`
  # available for filtering. It also promotes `agency.session_id`, a fresh UUID
  # per Copilot session, so every session mints a brand new time series for
  # every metric. Seven sessions from one laptop already generate 529 series.
  #
  # Dropping that attribute on its own is NOT safe. Copilot exports cumulative
  # counters, one independent stream per session. Strip the only attribute that
  # tells the streams apart and they collapse onto a single label set whose
  # value jumps around as sessions interleave. Every jump down reads as a
  # counter reset, so `increase()` re-counts the whole series each time and
  # reports totals several times larger than the counter itself.
  #
  # So: convert to delta first, while the session ID still separates the
  # streams; then drop it; then re-accumulate. Deltas add correctly across
  # sessions, which is exactly the aggregation we want.
  cumulative_to_delta:
    include:
      match_type: regexp
      metrics:
        - "gen_ai\\..*"
        - "github\\.copilot\\..*"

  resource/metrics_cardinality:
    attributes:
      - key: agency.session_id
        action: delete

  delta_to_cumulative: {}

  # Copilot stamps prompts and tool arguments onto spans only when
  # `captureContent` is true. If you ever turn that on, this is where you would
  # scrub. Left commented so the default pipeline stays lossless.
  #
  # redaction:
  #   allow_all_keys: true
  #   blocked_values: ["ghp_[A-Za-z0-9]{36}", "github_pat_[A-Za-z0-9_]{82}"]

exporters:
  prometheus:
    endpoint: 0.0.0.0:8889
    # Copies service.name / service.version onto every series so you can filter
    # by client version in Grafana.
    resource_to_telemetry_conversion:
      enabled: true

  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true

  debug:
    verbosity: normal

service:
  telemetry:
    logs:
      level: info
  pipelines:
    metrics:
      receivers: [otlp]
      processors:
        - memory_limiter
        - cumulative_to_delta
        - resource/metrics_cardinality
        - delta_to_cumulative
        - batch
      exporters: [prometheus, debug]
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [debug]
